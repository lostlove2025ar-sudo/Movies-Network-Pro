name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'

    - name: Re-create Full Flutter Project Structure
      run: |
        mkdir temp_app
        cd temp_app
        flutter create --org com.example movies_network_pro
        cp -r movies_network_pro/android ../
        cd ..
        rm -rf temp_app

    - name: Get dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Netflix-MoviesBazar-APK
        path: build/app/outputs/flutter-apk/app-release.apk
